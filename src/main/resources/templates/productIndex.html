<!DOCTYPE html>
<html lang="en">
<head>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<title>Velocity Training center</title>
</head>
<body>
	<div class="container mt-5">
		<h2>Product Details Input</h2>
		<font color="green">
		<p th:text="${smsg}"></font>
		<font color="red">
		<p th:text="${fmsg}"></font>
		
		<form th:action="@{p.pid !=null ? '/update':'/product'}" method="post">
          <input type="hidden" name="pid" th:value="${p.pid}">
			Product Name: <input type="text" name="name" required> <br>
			<br> Product Price: <input type="number" name="price" required>
			<br> <br> Product Qty : <input type="number" name="qty">
			<br> <br>
			<button type="submit" class="btn btn-primary"
			th:text="@{p.pid !=null ? 'update':'save'}">Save</button>

		</form>
		<a href="/Allproduct">View all product</a>
	</div>
</body>
</html>
