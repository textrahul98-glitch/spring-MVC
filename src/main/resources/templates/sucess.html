<!DOCTYPE html>
<html lang="en">
<head>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body>
	<div class="container mt-5">
		<h2>Registration Successful</h2>
		<p>
			Name:<span th:text="${student.name}"></span>
		</p>
		<p>
			Email:<span th:text="${student.email}"></span>
		</p>
		<p>
			Course:<span th:text="${student.course}"></span>
		</p>

		<a href="/student">
			<button type="button">Register another Student</button>
		</a>
	</div>
</body>
</html>
